version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - my_network
    restart: always

  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network

  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - my_network

  backend:
    build: ./backend
    container_name: django-backend
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - my_network
    restart: always

  frontend:
    build: ./frontend
    container_name: nextjs-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    networks:
      - my_network
    restart: always

  celery:
    build: ./backend
    container_name: celery-worker
    command: celery -A myproject worker --loglevel=info
    depends_on:
      - backend
      - redis
    env_file:
      - .env
    networks:
      - my_network
    restart: always

  celery-beat:
    build: ./backend
    container_name: celery-beat
    command: celery -A myproject beat --loglevel=info
    depends_on:
      - backend
      - redis
    env_file:
      - .env
    networks:
      - my_network
    restart: always

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data:

